plugins {
	id 'java'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(11)
	}
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = project.property('runeliteVersion')
def pluginMainClass = 'com.example.RogueScapePluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.example'
version = '1.0-SNAPSHOT'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

tasks.register('shadowBuild') {
	dependsOn shadowJar

	doLast {
		def jarName = project.property("pluginJarName")

		// EVERYTHING goes inside /plugin/roguescape
		def outputDir = layout.buildDirectory.dir("plugin/roguescape").get().asFile

		delete outputDir
		outputDir.mkdirs()

		// Copy shadow jar into plugin folder
		copy {
			from(shadowJar.archiveFile)
			into(outputDir)
			rename { "${jarName}.jar" }
		}

		// Copy assets into plugin folder
		copy {
			from(layout.projectDirectory.dir("assets"))
			into(new File(outputDir, "assets"))
		}

		// Copy launcher.ps1
		copy {
			from(layout.projectDirectory.file("launcher.ps1"))
			into(outputDir)
		}

		// Copy Gradle wrapper files
		copy {
			from("gradlew")
			from("gradlew.bat")
			into(outputDir)
		}

		// Copy gradle wrapper directory
		copy {
			from("gradle")
			into(new File(outputDir, "gradle"))
		}

		// Copy build.gradle
		copy {
			from("build.gradle")
			into(outputDir)
		}

		// Copy settings.gradle if it exists
		if (file("settings.gradle").exists()) {
			copy {
				from("settings.gradle")
				into(outputDir)
			}
		}

		// Copy gradle.properties
		copy {
			from("gradle.properties")
			into(outputDir)
		}

		// Copy source code
		copy {
			from("src")
			into(new File(outputDir, "src"))
		}

		println "Shadow build complete -> ${outputDir}"
	}
}

tasks.register('generateRunBat') {
	dependsOn shadowBuild

	doLast {
		def jarName = project.property("pluginJarName")
		def pluginDir = layout.buildDirectory.dir("plugin/roguescape").get().asFile
		def batFile = new File(pluginDir, "run.bat")

		batFile.text =
				"@echo off\n" +
						"cd /d %~dp0\n" +
						"powershell -ExecutionPolicy Bypass -File launcher.ps1\n"

		println "Generated run.bat at ${batFile.absolutePath}"
	}
}

tasks.register('packageRelease', Zip) {
	dependsOn shadowBuild, generateRunBat

	def jarName = project.property("pluginJarName")

	archiveFileName = "${jarName}.zip"
	destinationDirectory = layout.buildDirectory.dir("releases")

	// Zip the folder
	from(layout.buildDirectory.dir("plugin")) {
		into("")
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}